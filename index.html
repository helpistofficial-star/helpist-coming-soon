
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>HELPIST | Coming Soon</title>
  <meta name="description" content="HELPIST - Your On-Demand Personal Helper. Personal Helper, Anytime, Anywhere.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #333333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 30px 24px;
    }

    header {
      text-align: center;
      padding: 35px 0 20px;
    }

    .logo {
      width: min(420px, 85%);
      height: auto;
      max-height: 180px;
      object-fit: contain;
      display: block;
      margin: 0 auto 25px;
    }

    .brand-name {
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 800;
      letter-spacing: 2px;
      color: #888888;
    }

    .brand-name span {
      color: #20cbd5;
    }

    .tagline {
      font-size: clamp(16px, 2.5vw, 22px);
      margin-top: 14px;
      color: #555555;
    }

    main {
      text-align: center;
      padding: 50px 15px 65px;
    }

    .coming {
      color: #20cbd5;
      font-size: clamp(32px, 6vw, 58px);
      font-weight: 800;
      margin-bottom: 20px;
    }

    .message {
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.8;
      color: #666666;
      max-width: 700px;
      margin: 0 auto 35px;
    }

    .contact-section {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      max-width: 750px;
      margin: auto;
    }

    .contact-card {
      padding: 25px 20px;
      border: 1px solid #e8e8e8;
      border-top: 4px solid #20cbd5;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.04);
    }

    .contact-card h3 {
      font-size: 18px;
      color: #777777;
      margin-bottom: 12px;
    }

    .contact-card a {
      color: #20b9c5;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      word-break: break-word;
    }

    .contact-card a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: auto;
      text-align: center;
      padding: 24px 15px;
      background: #f7f9fa;
      color: #888888;
      font-size: 14px;
      border-top: 1px solid #eeeeee;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px 18px;
      }

      header {
        padding-top: 25px;
      }

      .logo {
        width: 90%;
        max-height: 130px;
        margin-bottom: 20px;
      }

      main {
        padding: 35px 5px 45px;
      }

      .message {
        line-height: 1.7;
      }

      .contact-section {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .contact-card {
        padding: 23px 15px;
      }

      footer {
        padding: 20px 12px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <header>
      <img src="logo.png" alt="HELPIST Logo" class="logo"
           onerror="this.style.display='none'">

      <div class="brand-name">HELP<span>!</span>ST</div>

      <p class="tagline">Your On-Demand Personal Helper</p>
    </header>

    <main>
      <h1 class="coming">We're Coming Soon!</h1>

      <p class="message">
        Personal Helper, Anytime, Anywhere.<br>
        We're working hard to bring you a smarter, simpler
        way to get things done. Stay tuned!
      </p>

      <div class="contact-section">

        <div class="contact-card">
          <h3>General Enquiries</h3>
          <a href="mailto:contact@helpist.in">
            contact@helpist.in
          </a>
        </div>

        <div class="contact-card">
          <h3>Careers &amp; Opportunities</h3>
          <a href="mailto:hiring@helpist.in">
            hiring@helpist.in
          </a>
        </div>

      </div>
    </main>
  </div>

  <footer>
    Helping you. Simplifying life.
  </footer>

</body>
</html>
